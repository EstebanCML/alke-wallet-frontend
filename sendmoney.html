<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero</title>
    <script src="js/auth-check.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Enviar Dinero</h2>

        <form id="formBusqueda">
            <div class="form-group">
                <label for="searchContact">Buscar en la agenda de transferencias:</label>
                <input type="text" class="form-control" id="searchContact" placeholder="Search contact">
                <button type="submit" class="btn btn-primary">🔍 Buscar</button>
                <button type="button" id="contactAdd" class="btn btn-primary">Agregar nuevo contacto</button>
            </div>
        </form>
        <form id="formTransferencia">
            <div class="form-group cdlt">
                <label for="depositDecrease">Cantidad de la transferencia:</label>
                <input type="number" class="form-control" id="depositDecrease" placeholder="$">
                <div class="form-text">
                    Saldo disponible: <span id="maxTransferAmount">$0</span>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Enviar dinero</button>
                <button type="button" class="btn btn-secondary ms-2" id="return2">Volver al Menú Principal</button>
            </div>
            <div id="msgAlert"></div>
        </form>
        <h3 class="mt-4">Contactos</h3>
        <ul id="contactList" class="list-group">
            <li class="list-group-item">
                <div class="contact-info">
                    <input class="form-check-input" type="radio" id="contactOption1" name="contactoSeleccionado"
                        value='{"nombre":"John Doe","cuenta":"123456789","alias":"john.doe","banco":"ABC Bank"}'>
                    <span class="contact-name"><strong>John Doe</strong></span>
                    <span class="contact-details"> - Número de cuenta: 123456789, Alias: john.doe, Banco: ABC Bank</span>
                </div>
            </li>
            <li class="list-group-item">
                <div class="contact-info">
                    <input class="form-check-input" type="radio" id="contactOption2" name="contactoSeleccionado"
                        value='{"nombre":"Jane Smith","cuenta":"987654321","alias":"jane.smith","banco":"XYZ Bank"}'>
                    <span class="contact-name"><strong>Jane Smith</strong></span>
                    <span class="contact-details"> - Número de cuenta: 987654321, Alias: jane.smith, Banco: XYZ Bank</span>
                </div>
            </li>
            <!-- Los nuevos contactos se agregarán aquí -->
        </ul>
            
        <!-- Modal para agregar contacto -->
        <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Agregar Nuevo Contacto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addContactForm">
                            <div class="mb-3">
                                <label for="newContactName" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="newContactName" required>
                            </div>
                            <div class="mb-3">
                                <label for="newContactCBU" class="form-label">Numero de cuenta</label>
                                <input type="text" class="form-control" id="newContactCBU" required>
                            </div>
                            <div class="mb-3">
                                <label for="newContactAlias" class="form-label">Alias</label>
                                <input type="text" class="form-control" id="newContactAlias" required>
                            </div>
                            <div class="mb-3">
                                <label for="newContactBank" class="form-label">Banco</label>
                                <input type="text" class="form-control" id="newContactBank" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Agregar Contacto</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script src="js/sendmoney.js"></script>
</body>
</html>
