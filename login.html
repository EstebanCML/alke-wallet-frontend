<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">

</head>
<body>

    <div class="container">
        <Header>
            <h2>Inicio de sesión</h2>
        </Header>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="userInput" placeholder="ROOT" required>
                <label for="userInput">Usuario</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="passInput" placeholder="Password" required>
                <label for="passInput">Password</label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
            
        
            <div id="mensajeAlerta" class="mt-3"></div>

        </form>





    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
