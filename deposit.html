<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar</title>
    <script src="js/auth-check.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Depositar</h2>
        <form id="depositForm">
            <div class="form-group">
                <label for="depositInput">Monto a depositar:</label>
                <input type="number" class="form-control" id="depositInput" placeholder="$">
            </div>
            <button type="submit" id="btnDeposit" class="btn btn-primary">Realizar depósito</button>
        </form>
        <button type="button" class="btn btn-secondary" id="return1">Volver al Menú Principal</button>
        <button type="button" class="btn btn-primary btn-new-deposit" id="addNewDeposit">Hacer otra deposito</button>
        <div id="msgAlert" class="mt-3"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script src="js/deposit.js"></script>
</body>
</html>
